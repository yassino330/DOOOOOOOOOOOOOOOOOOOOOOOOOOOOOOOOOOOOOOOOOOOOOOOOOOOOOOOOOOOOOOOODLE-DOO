name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**","electron/**","package.json","package-lock.json","electron.vite.config.ts",".github/workflows/windows-installer.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build and package installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Doodle-doo-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14